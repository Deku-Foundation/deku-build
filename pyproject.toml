[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deku-build-plan"
version = "0.1.0"
description = "Non-executing build plan validator for Deku Linux"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"

[project.scripts]
deku-build-plan = "deku_build.cli:main"

[tool.setuptools.packages.find]
include = ["deku_build*"]
