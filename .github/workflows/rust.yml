name: Rust build-plan core

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets --all-features
      - name: Validate example build plan with Rust CLI
        run: cargo run --locked -- validate-plan examples/build-plan.json
      - name: Validate independent native profile contract
        run: cargo run --locked -- validate-native-profile examples/native-minimal-profile.json
